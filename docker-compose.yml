services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: entorno_seguros_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-entorno_seguros_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - entornos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entorno_seguros_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: entornos-seguros-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@entornosseguros.gov.co}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AdminPassword123!}
    ports:
      - "5050:80"
    networks:
      - entornos-network
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: entornos-seguros-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - entornos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  entornos-network:
    driver: bridge
