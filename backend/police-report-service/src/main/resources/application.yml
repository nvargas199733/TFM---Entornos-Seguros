spring:
  application:
    name: police-report-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/entorno_seguros_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: police_report
        hbm2ddl:
          create_namespaces: true

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
