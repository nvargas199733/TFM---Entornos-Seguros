spring:
  application:
    name: auth-user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/entornos_seguros_db}
    username: ${DB_USERNAME:entornos_user}
    password: ${DB_PASSWORD:TuContrasenaSegura123!}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth_user
        hbm2ddl:
          create_namespaces: true

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET:entornos-seguros-jwt-secret-for-dev-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health,info
